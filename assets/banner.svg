<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <style>
      .pulse-bg {
        animation: pulse 6s ease-in-out infinite alternate;
      }
      .float-card-1 {
        animation: float1 5s ease-in-out infinite alternate;
      }
      .float-card-2 {
        animation: float2 7s ease-in-out infinite alternate;
      }
      .glow-line {
        stroke-dasharray: 200 400;
        animation: dash 8s linear infinite;
      }
      @keyframes dash {
        to { stroke-dashoffset: -600; }
      }
      @keyframes float1 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-12px); }
      }
      @keyframes float2 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(12px); }
      }
      @keyframes pulse {
        0% { opacity: 0.3; }
        100% { opacity: 0.7; }
      }
      .title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        font-size: 52px;
        fill: #ffffff;
        letter-spacing: -1px;
      }
      .subtitle {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 14px;
        fill: #f8fafc;
      }
    </style>
  </defs>

  <!-- Base Layer -->
  <rect width="1200" height="300" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- Dynamic / Animated Background Graphical Elements -->
  <!-- Animated Blueprint Lines in Background -->
  <path class="glow-line" d="M -100 250 L 300 50 L 700 250 L 1300 50" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.4"/>
  <path class="glow-line" d="M -100 80 L 400 280 L 900 30 L 1300 220" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.3"/>

  <!-- Background Decorative Glowing Spheres -->
  <circle cx="150" cy="80" r="100" fill="#3b82f6" opacity="0.15" filter="blur(40px)" class="pulse-bg"/>
  <circle cx="1050" cy="220" r="120" fill="#8b5cf6" opacity="0.15" filter="blur(40px)" class="pulse-bg"/>

  <!-- Right Side Animated Decorative Pill Cards (Behind or offset from main text to ensure 100% readability) -->
  <g class="float-card-1" transform="translate(820, 45)">
    <rect width="320" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" opacity="0.95"/>
    <circle cx="35" cy="30" r="14" fill="#3b82f6" opacity="0.2"/>
    <text x="35" y="35" text-anchor="middle" fill="#60a5fa" font-size="16" font-weight="bold">🏗️</text>
    <text x="65" y="27" font-family="system-ui" font-size="14" font-weight="bold" fill="#f8fafc">Job Costing &amp; WIP</text>
    <text x="65" y="46" font-family="system-ui" font-size="12" fill="#94a3b8">Real-time Budget &amp; Revenue Tracking</text>
  </g>

  <g class="float-card-2" transform="translate(860, 125)">
    <rect width="300" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" opacity="0.95"/>
    <circle cx="35" cy="30" r="14" fill="#10b981" opacity="0.2"/>
    <text x="35" y="35" text-anchor="middle" fill="#34d399" font-size="16" font-weight="bold">📊</text>
    <text x="65" y="27" font-family="system-ui" font-size="14" font-weight="bold" fill="#f8fafc">AIA G702/G703 Billing</text>
    <text x="65" y="46" font-family="system-ui" font-size="12" fill="#94a3b8">Progress Billing &amp; Retainage</text>
  </g>

  <g class="float-card-1" transform="translate(800, 205)">
    <rect width="330" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" opacity="0.95"/>
    <circle cx="35" cy="30" r="14" fill="#f59e0b" opacity="0.2"/>
    <text x="35" y="35" text-anchor="middle" fill="#fbbf24" font-size="16" font-weight="bold">⚡</text>
    <text x="65" y="27" font-family="system-ui" font-size="14" font-weight="bold" fill="#f8fafc">Certified Payroll &amp; Compliance</text>
    <text x="65" y="46" font-family="system-ui" font-size="12" fill="#94a3b8">Prevailing Wage &amp; Union Reporting</text>
  </g>

  <!-- Foreground Title and Subtitle (Crisp & Completely Unobstructed) -->
  <g transform="translate(70, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 48)">
      <rect width="260" height="30" rx="15" fill="url(#goldGrad)"/>
      <text x="130" y="20" text-anchor="middle" class="badge-text">👷 AWESOME CONSTRUCTION ERP</text>
    </g>

    <!-- Main Title with Gradient Accent -->
    <text x="0" y="140" class="title">
      Construction ERP <tspan fill="url(#accentGrad)">Ecosystem</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="180" class="subtitle">
      Curated Financials, AIA Billing, Job Costing &amp; Subcontractor Management
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 215)">
      <rect x="0" y="0" width="130" height="32" rx="8" fill="#334155" stroke="#475569" stroke-width="1"/>
      <text x="65" y="21" text-anchor="middle" font-family="system-ui" font-size="13" fill="#cbd5e1" font-weight="600">💼 Top SaaS</text>

      <rect x="142" y="0" width="160" height="32" rx="8" fill="#334155" stroke="#475569" stroke-width="1"/>
      <text x="222" y="21" text-anchor="middle" font-family="system-ui" font-size="13" fill="#cbd5e1" font-weight="600">🔓 Open-Source Repos</text>

      <rect x="314" y="0" width="160" height="32" rx="8" fill="#334155" stroke="#475569" stroke-width="1"/>
      <text x="394" y="21" text-anchor="middle" font-family="system-ui" font-size="13" fill="#cbd5e1" font-weight="600">📈 Market Intelligence</text>
    </g>
  </g>
</svg>
